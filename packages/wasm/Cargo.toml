[package]
name = "tokei-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser WebAssembly adapter for the original Rust tokei engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokei = { version = "=15.0.0", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# etcetera (used by tokei's filesystem configuration API) pulls in home.
# Upstream home 0.5.12 lacks a fallback for wasm32-unknown-unknown.
# The local patch only returns None on targets without a home directory.
[patch.crates-io]
home = { path = "vendor/home" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
