name: Build Rust tokei Wasm and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Native upstream tokei tests
        run: cargo test --manifest-path wasm/Cargo.toml --lib --locked
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Compile Rust tokei to browser Wasm
        run: wasm-pack build wasm --release --target web --out-dir ../docs/pkg --out-name tokei_wasm --no-opt --locked
      - name: Verify compiled Wasm exists
        run: |
          test -s docs/pkg/tokei_wasm_bg.wasm
          test -s docs/pkg/tokei_wasm.js
          ls -lh docs/pkg/tokei_wasm_bg.wasm
      - name: Browser adapter and Wasm integration tests
        run: node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: npm run test:browser
      - name: Packaged extension browser tests
        run: npm run test:extensions
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
